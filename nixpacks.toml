# 🕷️ Milanuncios Scraper — Railway All-in-One

Un único servicio que corre **frontend Next.js + backend Python** en Railway.

## 🗂️ Estructura

```
milanuncios-all-in-one/
├── scraper/           # Motor de scraping (Playwright)
├── frontend/          # Next.js (se compila a estático)
├── api.py             # FastAPI — sirve API + frontend
├── requirements.txt   # Dependencias Python
├── nixpacks.toml      # Instrucciones de build para Railway
└── build.sh           # Script de build manual (opcional)
```

## 🚀 Deploy en Railway

### Opción A — desde GitHub (recomendado)

1. Sube esta carpeta a un repositorio GitHub
2. Ve a [railway.app](https://railway.app) → **New Project** → **Deploy from GitHub repo**
3. Selecciona el repo
4. Railway detecta `nixpacks.toml` automáticamente y construye todo
5. En **Settings → Networking** → genera un dominio público
6. ¡Listo! Todo corre en una sola URL

### Opción B — desde CLI

```bash
npm install -g @railway/cli
railway login
railway init
railway up
```

## ⚙️ Variables de entorno en Railway (opcional)

No son obligatorias, pero puedes añadir:

| Variable | Valor | Descripción |
|----------|-------|-------------|
| `PORT` | 8000 | Railway lo pone automáticamente |

## 💻 Correr en local

```bash
# 1. Instalar dependencias Python
python -m venv venv
source venv/bin/activate   # Windows: venv\Scripts\activate
pip install -r requirements.txt
playwright install chromium

# 2. Build del frontend
cd frontend
npm install
npm run build
cd ..
cp -r frontend/out frontend_out

# 3. Arrancar
python api.py
# Abrir http://localhost:8000
```

## 🔧 Cómo funciona

1. Railway ejecuta `nixpacks.toml`:
   - Instala Python 3.11 + Node 20
   - Instala dependencias pip + npm
   - Compila Next.js → genera `/frontend/out` (HTML estático)
   - Copia `/frontend/out` → `/frontend_out`
2. FastAPI arranca en `$PORT`
3. Las rutas `/api/*` son manejadas por FastAPI
4. Todo lo demás sirve los archivos estáticos de Next.js
